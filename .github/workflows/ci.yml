name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/db
          NEXTAUTH_SECRET: ci
          NEXTAUTH_URL: http://localhost:3000
